:root{
  --navy:#304285; --deep:#0b1e42; --red:#e31e24; --sky:#8ea2d8; --card:#eef2f9;
  --u:4.2px; /* 1 % šířky karuselu; JS přepočítá (ResizeObserver) */
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#fff;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.kz{position:relative;width:min(100vw, calc(100vh * 9 / 16));aspect-ratio:9/16;max-height:100vh;
  border-radius:calc(var(--u)*2.2);overflow:hidden;background:radial-gradient(120% 80% at 50% 40%,#16295a 0%,#070f24 70%);
  isolation:isolate;outline:none;user-select:none;-webkit-user-select:none;touch-action:pan-y;
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.35)}
@supports not (aspect-ratio:1){.kz{height:min(100vh, calc(100vw * 16 / 9))}}
.kz:focus-visible{box-shadow:0 0 0 3px var(--sky)}
.stage{position:absolute;inset:0;perspective:calc(var(--u)*230);perspective-origin:50% 50%}
.slide{position:absolute;inset:0;transform-origin:50% 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  visibility:hidden;will-change:transform,opacity;background:#0b1e42;overflow:hidden}
.slide.on{visibility:visible}
.media,.media>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.media video{opacity:0;transition:opacity .25s}
.media video.live{opacity:1}
.kb{transform-origin:50% 45%;will-change:transform}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.gloss{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%)}

/* ---------- překryv partnera ---------- */
.scrim{position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none;
  background:linear-gradient(to top,rgba(4,10,26,.92) 0%,rgba(4,10,26,.72) 38%,rgba(4,10,26,0) 100%)}
.ov{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);bottom:calc(var(--u)*10);display:flex;flex-direction:column;gap:calc(var(--u)*2.6)}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:calc(var(--u)*1.6);
  padding:calc(var(--u)*1.25) calc(var(--u)*2.8);border-radius:999px;font-weight:800;font-size:calc(var(--u)*2.85);
  letter-spacing:.06em;text-transform:uppercase;line-height:1.15;
  background:rgba(8,16,38,.66);border:1px solid rgba(255,255,255,.28);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip i{width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);border-radius:50%;background:var(--red);flex:none;
  box-shadow:0 0 calc(var(--u)*1.6) var(--red)}
.chip.prize{background:linear-gradient(90deg,rgba(227,30,36,.92),rgba(160,18,24,.9));border-color:rgba(255,255,255,.4)}
.chip.prize i{background:#fff;box-shadow:0 0 calc(var(--u)*1.6) #fff}
.name{font-weight:900;font-size:calc(var(--u)*6.6);line-height:1.04;letter-spacing:-.01em;
  text-shadow:0 2px calc(var(--u)*2) rgba(0,0,0,.55);padding-top:.1em;margin-top:-.1em}
.name small{display:block;font-weight:600;font-size:.42em;letter-spacing:.04em;color:rgba(255,255,255,.8);margin-top:.35em}
.btn{align-self:flex-start;display:inline-flex;align-items:center;gap:.4em;padding:calc(var(--u)*2.2) calc(var(--u)*3.6);border-radius:999px;
  background:#fff;color:#0b1e42;font-weight:800;font-size:calc(var(--u)*3.3);text-decoration:none;white-space:nowrap;
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(0,0,0,.35);transition:transform .2s,background .2s,color .2s}
.btn b{color:var(--red);font-weight:900}
.btn:hover,.btn:focus-visible{background:var(--red);color:#fff;transform:translateY(-2px);outline:none}
.btn:hover b,.btn:focus-visible b{color:#fff}

/* ---------- úvodní snímek ---------- */
.intro .media img{filter:saturate(.9) brightness(.9)}
.intro .tint{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(11,30,66,.94) 0%,rgba(11,30,66,.80) 38%,rgba(11,30,66,.35) 62%,rgba(5,12,30,.92) 100%)}
.intro .sweep{position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(142,162,216,.18) 50%,transparent 60%);
  will-change:transform}
.intro .in{position:absolute;left:calc(var(--u)*7);right:calc(var(--u)*7);top:calc(var(--u)*14);text-align:center}
.intro .big{width:74%;height:auto;display:block;margin:0 auto calc(var(--u)*6);filter:drop-shadow(0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(0,0,0,.55))}
.kick{display:inline-flex;align-items:center;gap:calc(var(--u)*2.4);font-weight:800;font-size:calc(var(--u)*3.6);letter-spacing:.32em;
  text-transform:uppercase;color:#fff;padding-left:.32em}
.kick:before,.kick:after{content:"";width:calc(var(--u)*7);height:2px;background:var(--red)}
.intro h1{font-weight:900;font-size:calc(var(--u)*8.6);line-height:1.02;margin:calc(var(--u)*3.4) 0 calc(var(--u)*3);letter-spacing:-.01em;
  text-shadow:0 2px calc(var(--u)*2.5) rgba(0,0,0,.5)}
.intro h1 em{font-style:normal;color:var(--red)}
.when{display:inline-block;font-weight:800;font-size:calc(var(--u)*3.7);letter-spacing:.02em;padding:calc(var(--u)*1.6) calc(var(--u)*3.4);
  border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wall{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);bottom:calc(var(--u)*10);
  display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*1.4);padding:calc(var(--u)*2.6) calc(var(--u)*2.4) calc(var(--u)*2.8);
  border-radius:calc(var(--u)*3);background:rgba(8,16,38,.55);border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.wall button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;height:calc(var(--u)*11);border-radius:calc(var(--u)*1.6);
  transition:background .2s,transform .2s}
.wall button:hover,.wall button:focus-visible{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.wall img{max-width:88%;max-height:78%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.wall-t{grid-column:1/-1;text-align:center;font-weight:700;font-size:calc(var(--u)*2.6);padding-bottom:calc(var(--u)*.8);
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.8)}

/* ---------- trvalé prvky ---------- */
.ta{position:absolute;left:6.806%;top:13.385%;width:26.02%;height:auto;z-index:5;pointer-events:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.55)) drop-shadow(0 0 calc(var(--u)*1.5) rgba(0,0,0,.25));transition:opacity .35s}
.ta.off{opacity:0}
.dots{position:absolute;left:0;right:0;bottom:calc(var(--u)*4.2);z-index:6;display:flex;justify-content:center;gap:calc(var(--u)*1.3)}
.dots button{all:unset;cursor:pointer;position:relative;width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);border-radius:999px;
  background:rgba(255,255,255,.38);overflow:hidden;transition:width .35s cubic-bezier(.2,.8,.2,1),background .2s}
.dots button:before{content:"";position:absolute;inset:-8px}
.dots button.on{width:calc(var(--u)*9);background:rgba(255,255,255,.3)}
.dots button i{position:absolute;inset:0;background:#fff;transform-origin:0 50%;transform:scaleX(0)}
.dots button.on i{background:linear-gradient(90deg,#fff,#fff)}
.dots button:focus-visible{box-shadow:0 0 0 2px var(--sky)}
.nav{position:absolute;top:50%;z-index:6;width:calc(var(--u)*10);height:calc(var(--u)*10);margin-top:calc(var(--u)*-5);border:0;border-radius:50%;
  background:rgba(8,16,38,.5);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;
  transition:opacity .25s,background .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.nav svg{width:46%;height:46%}
.nav.prev{left:calc(var(--u)*2.5)} .nav.next{right:calc(var(--u)*2.5)}
.kz:hover .nav,.nav:focus-visible{opacity:1}
.nav:hover{background:var(--red)}
@media (hover:none){.nav{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cap .nav{display:none}
</style>
